[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# worker.py must call django.setup() before importing app code, so
# its Django imports legitimately sit after the setup call.
"worker.py" = ["E402"]

[tool.coverage.run]
source = ["core"]
omit = ["core/migrations/*", "*/tests.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
